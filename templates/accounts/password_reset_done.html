{% extends "base.html" %}

{% block title %}Password Reset Email Sent{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Password Reset Email Sent</h4>
            </div>
            <div class="card-body">
                <p>We've emailed you instructions for setting your password. If they haven't arrived in a few minutes, please check your spam folder.</p>
                <p><a href="{% url 'login' %}" class="btn btn-primary">Return to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
